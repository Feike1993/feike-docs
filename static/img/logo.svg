<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal window background -->
  <rect width="200" height="200" rx="36" fill="#0F172A"/>
  <rect x="12" y="12" width="176" height="176" rx="28" fill="#1E293B" stroke="#334155" stroke-width="2"/>

  <!-- Window controls -->
  <circle cx="44" cy="44" r="7" fill="#EF4444"/>
  <circle cx="66" cy="44" r="7" fill="#F59E0B"/>
  <circle cx="88" cy="44" r="7" fill="#10B981"/>

  <!-- Title bar separator -->
  <line x1="28" y1="64" x2="172" y2="64" stroke="#334155" stroke-width="2"/>

  <!-- Code brackets </> -->
  <path d="M78 108 L58 128 L78 148" stroke="#2DD4BF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 96 L114 160" stroke="#2DD4BF" stroke-width="9" stroke-linecap="round"/>
  <path d="M122 108 L142 128 L122 148" stroke="#2DD4BF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blinking cursor -->
  <rect x="152" y="114" width="7" height="30" rx="2" fill="#2DD4BF" opacity="0.85"/>
</svg>
